# Description: Standalone ESPHome config for Spectra LS Remote tabletop control box (encoder + transport buttons + battery telemetry).
# Version: 2026.08.14.2
# Last updated: 2026-08-14
# Notes:
# - BLE transport removed; control lane is direct Wi-Fi/TCP.

substitutions:
  device_name: spectra-ls-remote
  friendly_name: "Spectra LS Remote"

  # Network
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Control-hub contract surfaces
  remote_force_target_enabled: "false"
  remote_forced_target: media_player.kitchen_wiim
  remote_target_helper: sensor.component_active_target
  remote_esp_control_target_sensor: sensor.spectra_ls_system_esp_control_target
  remote_fallback_target_sensor: sensor.component_now_playing_entity
  remote_control_host_sensor: sensor.spectra_ls_system_esp_control_host
  remote_control_hosts_sensor: sensor.spectra_ls_system_esp_control_hosts
  remote_control_port_sensor: sensor.spectra_ls_system_esp_control_port
  remote_control_host_sensor_prefixed: sensor.living_room_spectra_ls_system_esp_control_host
  remote_control_hosts_sensor_prefixed: sensor.living_room_spectra_ls_system_esp_control_hosts
  remote_control_port_sensor_prefixed: sensor.living_room_spectra_ls_system_esp_control_port
  remote_source_sensor: sensor.component_now_playing_source
  remote_now_playing_state_sensor: sensor.component_now_playing_state
  remote_active_volume_sensor: sensor.component_now_playing_volume
  remote_volume_acceleration_helper: input_boolean.spectra_ls_remote_volume_acceleration
  remote_direct_control_default_port: "8899"

  # Hardware pins (baseline defaults for ESP32-C6 Super Mini bring-up)
  encoder_pin_a: GPIO2
  encoder_pin_b: GPIO3
  encoder_press_pin: GPIO1
  next_button_pin: GPIO7
  battery_adc_pin: GPIO6

  # Interaction tuning
  button_cooldown_ms: "220"
  mute_cooldown_ms: "250"
  volume_step_cooldown_ms: "35"
  remote_volume_step_pct: "5"
  remote_volume_step_slow_pct: "2"
  remote_volume_step_fast_pct: "2"
  remote_volume_step_fast_window_ms: "320"
  remote_encoder_emit_gate_ms: "30"
  remote_encoder_same_dir_lock_ms: "35"
  remote_encoder_max_detents_per_emit: "4"
  remote_encoder_flush_delay_ms: "15"
  remote_encoder_direction_multiplier: "-1"
  remote_unresolved_log_interval_ms: "1500"
  remote_direct_transport_enabled: "true"
  remote_control_center_offline_direct_fallback: "true"

  # Battery model
  remote_has_battery: "true"
  battery_divider_ratio: "2.05"
  battery_empty_v: "3.30"
  battery_full_v: "4.20"

  # Sleep model
  remote_deep_sleep_enabled: "true"
  remote_idle_sleep_ms: "60000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - arylic_tcp_remote.h
  on_boot:
    priority: 250
    then:
      - lambda: |-
          const uint32_t now = millis();
          id(remote_last_input_ms) = now;
          id(remote_last_transport_ms) = 0;
          id(remote_last_unresolved_log_ms) = 0;
          id(remote_resolved_target) = "";
          id(remote_last_encoder_turn_interval_ms) = 1000;
          id(remote_last_playing_ms) = 0;
          id(remote_last_encoder_interaction_ms) = now;
          id(remote_pending_encoder_delta) = 0;

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: WARN

api:
  id: remote_ha_api
  homeassistant_states: true
  homeassistant_services: true

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  power_save_mode: NONE
  manual_ip:
    static_ip: 192.168.10.41
    gateway: 192.168.10.1
    subnet: 255.255.255.0
    dns1: 192.168.10.7

deep_sleep:
  id: remote_sleep_ctrl
  esp32_ext1_wakeup:
    pins:
      - number: ${encoder_press_pin}
        allow_other_uses: true
      - number: ${next_button_pin}
        allow_other_uses: true
    mode: ANY_LOW

time:
  - platform: homeassistant
    id: remote_ha_time

globals:
  - id: remote_last_input_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_transport_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_mute_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_unresolved_log_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_resolved_target
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: remote_encoder_last_position
    type: int
    restore_value: no
    initial_value: "0"
  - id: remote_encoder_position_initialized
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_last_volume_step_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_encoder_emit_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_encoder_direction
    type: int
    restore_value: no
    initial_value: "0"
  - id: remote_last_encoder_direction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_mute_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_volume_level_shadow
    type: float
    restore_value: no
    initial_value: "0.5"
  - id: remote_volume_level_shadow_before_send
    type: float
    restore_value: no
    initial_value: "0.5"
  - id: remote_route_host_last_valid
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: remote_route_hosts_last_valid
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: remote_route_port_last_valid
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: remote_last_volume_sensor_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_encoder_turn_interval_ms
    type: uint32_t
    restore_value: no
    initial_value: "1000"
  - id: remote_last_playing_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_last_encoder_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_pending_encoder_delta
    type: int
    restore_value: no
    initial_value: "0"

text_sensor:
  - platform: template
    name: "Remote Control Lane"
    id: remote_control_lane
    icon: mdi:transit-connection-variant
    update_interval: 30s
    lambda: |-
      if (id(remote_ha_api).is_connected()) return {"direct_wifi"};
      return {"wifi_disconnected"};

  - platform: template
    name: "Remote Transport Mode"
    id: remote_transport_mode
    icon: mdi:lan-connect
    update_interval: 30s
    lambda: |-
      if (id(remote_ha_api).is_connected()) {
        return {"wifi_api_live"};
      }
      const bool has_cached_route = !id(remote_route_hosts_last_valid).empty() || !id(remote_route_host_last_valid).empty();
      if (${remote_control_center_offline_direct_fallback} && has_cached_route) {
        return {"wifi_offline_direct_fallback"};
      }
      if (${remote_control_center_offline_direct_fallback} && !has_cached_route) {
        return {"wifi_offline_no_route_cached"};
      }
      return {"wifi_buffered_waiting_api"};

  - platform: homeassistant
    id: remote_active_target
    entity_id: ${remote_target_helper}
    internal: true
  - platform: homeassistant
    id: remote_fallback_target
    entity_id: ${remote_fallback_target_sensor}
    internal: true
  - platform: homeassistant
    id: remote_control_host
    entity_id: ${remote_control_host_sensor}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_host_last_valid) = value;
  - platform: homeassistant
    id: remote_control_host_prefixed
    entity_id: ${remote_control_host_sensor_prefixed}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_host_last_valid) = value;
  - platform: homeassistant
    id: remote_control_hosts
    entity_id: ${remote_control_hosts_sensor}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_hosts_last_valid) = value;
  - platform: homeassistant
    id: remote_control_hosts_prefixed
    entity_id: ${remote_control_hosts_sensor_prefixed}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_hosts_last_valid) = value;
  - platform: homeassistant
    id: remote_control_port
    entity_id: ${remote_control_port_sensor}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_port_last_valid) = value;
  - platform: homeassistant
    id: remote_control_port_prefixed
    entity_id: ${remote_control_port_sensor_prefixed}
    internal: true
    on_value:
      - lambda: |-
          std::string value = x.c_str();
          std::string low = value;
          for (auto &c : low) c = (char) ::tolower(c);
          const bool valid = !(low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          if (valid) id(remote_route_port_last_valid) = value;
  - platform: homeassistant
    id: remote_esp_control_target
    entity_id: ${remote_esp_control_target_sensor}
    internal: true
  - platform: homeassistant
    id: remote_active_source
    entity_id: ${remote_source_sensor}
    internal: true
  - platform: homeassistant
    id: remote_now_playing_state
    entity_id: ${remote_now_playing_state_sensor}
    internal: true
    on_value:
      - lambda: |-
          std::string state = x.c_str();
          for (auto &c : state) c = (char) ::tolower(c);
          if (state == "playing") {
            id(remote_last_playing_ms) = millis();
          }
sensor:
  - platform: rotary_encoder
    id: remote_encoder
    internal: true
    pin_a:
      number: ${encoder_pin_a}
      allow_other_uses: true
      mode:
        input: true
        pullup: true
    pin_b:
      number: ${encoder_pin_b}
      allow_other_uses: true
      mode:
        input: true
        pullup: true
    resolution: 4
    restore_mode: ALWAYS_ZERO
    on_value:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const int position = (int) x;
            if (!id(remote_encoder_position_initialized)) {
              id(remote_encoder_last_position) = position;
              id(remote_encoder_position_initialized) = true;
              return;
            }

            const int delta = position - id(remote_encoder_last_position);
            id(remote_encoder_last_position) = position;
            if (delta == 0) {
              return;
            }

            int detents = abs(delta);
            if (detents < 1) detents = 1;

            // Backup-stable policy: one physical callback emits one logical detent step.
            // Prevents bursty quadrature deltas from causing multi-step loudness jumps.
            if (detents > 1) detents = 1;

            if ((now - id(remote_last_encoder_emit_ms)) < (uint32_t) ${remote_encoder_emit_gate_ms}) {
              return;
            }

            const int direction = (delta > 0 ? 1 : -1) * (int) ${remote_encoder_direction_multiplier};

            // Suppress same-direction bounce bursts from a single physical detent.
            if (direction == id(remote_last_encoder_direction) &&
                (now - id(remote_last_encoder_direction_ms)) < (uint32_t) ${remote_encoder_same_dir_lock_ms}) {
              return;
            }

            const uint32_t turn_interval_ms = (id(remote_last_encoder_emit_ms) == 0)
                                              ? (uint32_t) 1000
                                              : (now - id(remote_last_encoder_emit_ms));
            id(remote_last_encoder_turn_interval_ms) = turn_interval_ms;
            id(remote_last_encoder_emit_ms) = now;
            id(remote_last_encoder_direction) = direction;
            id(remote_last_encoder_direction_ms) = now;
            id(remote_last_encoder_interaction_ms) = now;

            const int signed_detents = direction * detents;
            if (direction > 0) {
              ESP_LOGD("remote", "remote encoder detent cw (%d)", detents);
            } else {
              ESP_LOGD("remote", "remote encoder detent anticlockwise (%d)", detents);
            }

            int pending = id(remote_pending_encoder_delta);
            pending += signed_detents;
            const int max_pending = (int) ${remote_encoder_max_detents_per_emit};
            if (pending > max_pending) pending = max_pending;
            if (pending < -max_pending) pending = -max_pending;
            id(remote_pending_encoder_delta) = pending;
            id(remote_flush_encoder_turn).execute();

  - platform: adc
    id: remote_battery_voltage_raw
    pin: ${battery_adc_pin}
    attenuation: 12db
    update_interval: 25s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
    internal: true

  - platform: template
    name: "Remote Battery SoC"
    id: remote_battery_soc
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 25s
    lambda: |-
      if (!${remote_has_battery}) return {};
      if (!id(remote_battery_voltage_raw).has_state()) return {};
      const float raw_v = id(remote_battery_voltage_raw).state;
      if (isnan(raw_v)) return {};
      const float v = raw_v * ${battery_divider_ratio};
      if (isnan(v)) return {};
      const float lo = ${battery_empty_v};
      const float hi = ${battery_full_v};
      if (v <= lo) return 0.0f;
      if (v >= hi) return 100.0f;
      return ((v - lo) / (hi - lo)) * 100.0f;

  - platform: homeassistant
    id: remote_active_volume_pct
    entity_id: ${remote_active_volume_sensor}
    internal: true
    on_value:
      - lambda: |-
          const float sensed_pct = x;
          if (sensed_pct >= 0.0f && sensed_pct <= 100.0f) {
            id(remote_last_volume_sensor_ms) = millis();
          }

binary_sensor:
  - platform: status
    name: "Remote API Status"
    id: remote_api_status
    device_class: connectivity
    entity_category: diagnostic

  - platform: homeassistant
    id: remote_volume_acceleration_enabled
    entity_id: ${remote_volume_acceleration_helper}
    internal: true

  - platform: gpio
    id: remote_encoder_press_button
    name: "Remote Encoder Press Button"
    internal: true
    pin:
      number: ${encoder_press_pin}
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - lambda: |-
          ESP_LOGI("remote", "encoder press pin ON");
    on_release:
      - lambda: |-
          ESP_LOGI("remote", "encoder press pin OFF");
    on_multi_click:
      - timing:
          - ON for at least 750ms
          - OFF for at least 20ms
        then:
          - script.execute: remote_emit_encoder_long_press
      - timing:
          - ON for at most 749ms
          - OFF for at least 20ms
        then:
          - script.execute: remote_emit_encoder_press

  - platform: gpio
    id: remote_next_track_button
    name: "Remote Next Track Button"
    pin:
      number: ${next_button_pin}
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - script.execute: remote_emit_button_1

script:
  - id: remote_note_input
    mode: restart
    then:
      - lambda: |-
          id(remote_last_input_ms) = millis();

  - id: remote_emit_encoder_turn
    mode: queued
    parameters:
      delta: int
    then:
      - script.execute: remote_note_input
      - if:
          condition:
            lambda: |-
              const bool has_cached_route = !id(remote_route_hosts_last_valid).empty() || !id(remote_route_host_last_valid).empty();
              return ${remote_direct_transport_enabled} ||
                     (${remote_control_center_offline_direct_fallback} && !id(remote_ha_api).is_connected() && has_cached_route);
          then:
            - if:
                condition:
                  lambda: |-
                    return delta > 0;
                then:
                  - script.execute:
                      id: remote_volume_up_guarded
                      steps: !lambda |-
                        return delta;
                else:
                  - script.execute:
                      id: remote_volume_down_guarded
                      steps: !lambda |-
                        return -delta;

  - id: remote_flush_encoder_turn
    mode: restart
    then:
      - delay: ${remote_encoder_flush_delay_ms}ms
      - lambda: |-
          const int pending = id(remote_pending_encoder_delta);
          if (pending == 0) return;
          id(remote_pending_encoder_delta) = 0;
          id(remote_emit_encoder_turn).execute(pending);

  - id: remote_emit_encoder_press
    mode: restart
    then:
      - lambda: |-
          id(remote_last_encoder_interaction_ms) = millis();
      - if:
          condition:
            lambda: |-
              const bool has_cached_route = !id(remote_route_hosts_last_valid).empty() || !id(remote_route_host_last_valid).empty();
              return ${remote_direct_transport_enabled} ||
                     (${remote_control_center_offline_direct_fallback} && !id(remote_ha_api).is_connected() && has_cached_route);
          then:
            - script.execute: remote_mute_guarded

  - id: remote_emit_button_1
    mode: restart
    then:
      - script.execute: remote_note_input
      - if:
          condition:
            lambda: |-
              return id(remote_ha_api).is_connected();
          then:
            - script.execute: remote_next_track_guarded

  - id: remote_emit_encoder_long_press
    mode: restart
    then:
      - lambda: |-
          id(remote_last_encoder_interaction_ms) = millis();
      - lambda: |-
          // BLE lane removed; keep long-press reserved for future Wi-Fi-only actions.
          return;

  - id: remote_volume_up_guarded
    mode: queued
    parameters:
      steps: int
    then:
      - script.execute: remote_note_input
      - lambda: |-
          const bool has_cached_route = !id(remote_route_hosts_last_valid).empty() || !id(remote_route_host_last_valid).empty();
          const bool allow_direct = ${remote_direct_transport_enabled} ||
                                    (${remote_control_center_offline_direct_fallback} && !id(remote_ha_api).is_connected() && has_cached_route);
          if (!allow_direct) {
            return;
          }
          const uint32_t now = millis();
          if ((now - id(remote_last_volume_step_ms)) < (uint32_t) ${volume_step_cooldown_ms}) {
            return;
          }

          auto to_lower = [](std::string value) {
            for (auto &c : value) c = (char) ::tolower(c);
            return value;
          };
          auto is_unresolved = [&](const std::string &value) {
            const std::string low = to_lower(value);
            return (low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          };

          std::string target = "";
          if (${remote_force_target_enabled}) {
            target = std::string("${remote_forced_target}");
          } else {
            target = id(remote_active_target).has_state() ? id(remote_active_target).state.c_str() : "";
            if (is_unresolved(target) && id(remote_esp_control_target).has_state()) {
              target = id(remote_esp_control_target).state.c_str();
            }
            if (is_unresolved(target) && id(remote_fallback_target).has_state()) {
              target = id(remote_fallback_target).state.c_str();
            }
            if (is_unresolved(target)) {
              target = std::string("${remote_forced_target}");
            }
          }

          if (is_unresolved(target)) {
            if ((now - id(remote_last_unresolved_log_ms)) >= (uint32_t) ${remote_unresolved_log_interval_ms}) {
              id(remote_last_unresolved_log_ms) = now;
              ESP_LOGW("remote", "volume_up blocked: unresolved target primary='%s' esp='%s' fallback='%s' forced='%s'", id(remote_active_target).state.c_str(), id(remote_esp_control_target).state.c_str(), id(remote_fallback_target).state.c_str(), "${remote_forced_target}");
            }
            return;
          }

          float current_pct = id(remote_volume_level_shadow) * 100.0f;
          if (current_pct < 0.0f || current_pct > 100.0f) {
            current_pct = 50.0f;
          }

          if (id(remote_active_volume_pct).has_state()) {
            const float sensor_pct = id(remote_active_volume_pct).state;
            const uint32_t sensor_age_ms = now - id(remote_last_volume_sensor_ms);
            const uint32_t interaction_age_ms = now - id(remote_last_encoder_interaction_ms);
            const uint32_t local_step_age_ms = now - id(remote_last_volume_step_ms);
            if (sensor_pct >= 0.0f && sensor_pct <= 100.0f && sensor_age_ms <= 1000) {
              // During active knob motion, only allow small drift correction from HA sensor
              // to avoid abrupt rebasing/jumps from lagged state echoes.
              if (interaction_age_ms <= 2000 || local_step_age_ms <= 4000) {
                if (fabsf(sensor_pct - current_pct) <= 8.0f) {
                  current_pct = sensor_pct;
                  id(remote_volume_level_shadow) = sensor_pct / 100.0f;
                }
              } else {
                // In idle windows, permit bounded re-anchor only.
                if (fabsf(sensor_pct - current_pct) <= 15.0f) {
                  current_pct = sensor_pct;
                  id(remote_volume_level_shadow) = sensor_pct / 100.0f;
                }
              }
            }
          }

          int step_count = steps;
          if (step_count < 1) step_count = 1;
          const int max_step_count = (int) ${remote_encoder_max_detents_per_emit};
          if (step_count > max_step_count) step_count = max_step_count;

          const bool accel_enabled = id(remote_volume_acceleration_enabled).has_state() && id(remote_volume_acceleration_enabled).state;
          float step_pct = (float) ${remote_volume_step_slow_pct};
          const uint32_t turn_interval_ms = id(remote_last_encoder_turn_interval_ms);
          if (accel_enabled && turn_interval_ms <= (uint32_t) ${remote_volume_step_fast_window_ms}) {
            step_pct = (float) ${remote_volume_step_fast_pct};
          }

          float next_pct = current_pct + ((float) step_count * step_pct);
