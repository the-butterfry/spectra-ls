interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (!${remote_has_battery}) return false;
              if (!${remote_deep_sleep_enabled}) return false;

              const uint32_t tick = millis();

              const uint32_t last_activity_ms =
                  id(remote_last_encoder_interaction_ms) > id(remote_last_input_ms)
                      ? id(remote_last_encoder_interaction_ms)
                      : id(remote_last_input_ms);
              const uint32_t idle = tick - last_activity_ms;
              return idle >= (uint32_t) ${remote_idle_sleep_ms};
          then:
            - logger.log:
                level: INFO
                format: "Remote entering deep sleep after 60s user idle"
            - deep_sleep.enter: remote_sleep_ctrl

