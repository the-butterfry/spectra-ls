      - lambda: |-
          const bool has_cached_route = !id(remote_route_hosts_last_valid).empty() || !id(remote_route_host_last_valid).empty();
          const bool allow_direct = ${remote_direct_transport_enabled} ||
                                    (${remote_control_center_offline_direct_fallback} && !id(remote_ha_api).is_connected() && has_cached_route);
          if (!allow_direct) {
            return;
          }
          const uint32_t now = millis();
          if ((now - id(remote_last_transport_ms)) < (uint32_t) ${button_cooldown_ms}) {
            return;
          }

          auto to_lower = [](std::string value) {
            for (auto &c : value) c = (char) ::tolower(c);
            return value;
          };

          auto is_unresolved = [&](const std::string &value) {
            const std::string low = to_lower(value);
            return (low.empty() || low == "unknown" || low == "unavailable" || low == "none" || low == "null");
          };

          std::string target = "";
          if (${remote_force_target_enabled}) {
            target = std::string("${remote_forced_target}");
          } else {
            target = id(remote_active_target).has_state() ? id(remote_active_target).state.c_str() : "";
          }
          std::string fallback = id(remote_fallback_target).has_state() ? id(remote_fallback_target).state.c_str() : "";
          if (is_unresolved(target) && !is_unresolved(fallback)) {
            target = fallback;
          }

          if (is_unresolved(target)) {
            if ((now - id(remote_last_unresolved_log_ms)) >= (uint32_t) ${remote_unresolved_log_interval_ms}) {
              id(remote_last_unresolved_log_ms) = now;
              ESP_LOGW("remote", "next_track blocked: target unresolved (helper='%s' fallback='%s')", id(remote_active_target).state.c_str(), id(remote_fallback_target).state.c_str());
            }
            return;
          }

          std::string source = id(remote_active_source).has_state() ? id(remote_active_source).state.c_str() : "";
          std::string source_low = to_lower(source);
          const bool passthrough = source_low.find("optical") != std::string::npos ||
                                   source_low.find("line-in") != std::string::npos ||
                                   source_low.find("line in") != std::string::npos ||
                                   source_low.find("aux") != std::string::npos ||
                                   source_low.find("coax") != std::string::npos ||
                                   source_low.find("hdmi") != std::string::npos ||
