# Description: Spectra interactables bridge scaffold (BLE/Wi-Fi hybrid ingest to control-center execution).
# Version: 2026.07.17.13
# Last updated: 2026-07-17
# Update version/date whenever you change this file.

input_boolean:
  spectra_interactable_bridge_enabled:
    name: Spectra Interactable Bridge Enabled
    icon: mdi:bluetooth-connect
    initial: false

  spectra_interactable_shadow_mode:
    name: Spectra Interactable Shadow Mode
    icon: mdi:beaker-outline
    initial: true

  spectra_interactable_dedupe_enabled:
    name: Spectra Interactable Dedupe Enabled
    icon: mdi:filter-variant
    initial: true

  spectra_remote_wifi_maintenance_enabled:
    name: Spectra Remote Wi-Fi Maintenance Enabled
    icon: mdi:wifi-cog
    initial: false

  spectra_interactable_ble_button_single_source_enabled:
    name: Spectra Interactable BLE Button Single Source Enabled
    icon: mdi:gesture-tap-button
    initial: false

  spectra_interactable_ble_arriving_source_enabled:
    name: Spectra Interactable BLE Arriving Source Enabled
    icon: mdi:walk
    initial: false

  spectra_interactable_rollback_notifications_enabled:
    name: Spectra Interactable Rollback Notifications Enabled
    icon: mdi:bell-alert
    initial: true

  spectra_interactable_auto_promote_active_enabled:
    name: Spectra Interactable Auto Promote Active Enabled
    icon: mdi:auto-fix
    initial: false

input_text:
  spectra_interactable_last_event_json:
    name: Spectra Interactable Last Event JSON
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_error:
    name: Spectra Interactable Last Error
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_correlation_id:
    name: Spectra Interactable Last Correlation ID
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_interactable_id:
    name: Spectra Interactable Last Interactable ID
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_input_event:
    name: Spectra Interactable Last Input Event
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_transport:
    name: Spectra Interactable Last Transport
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_evidence_verdict:
    name: Spectra Interactable Last Evidence Verdict
    initial: ""
    max: 255
    mode: text

  spectra_interactable_last_evidence_blockers:
    name: Spectra Interactable Last Evidence Blockers
    initial: ""
    max: 255
    mode: text

  spectra_interactable_source_map_json:
    name: Spectra Interactable Source Map JSON
    initial: >-
      {"ble_button_single":{"interactable_id":"spectra_remote_ble_button_single_source","input_event":"button_1","target_hint":"","delta":null,"dry_run":false},"ble_arriving":{"interactable_id":"spectra_remote_ble_arriving_source","input_event":"button_2","target_hint":"","delta":null,"dry_run":false}}
    max: 255
    mode: text

  spectra_interactable_test_source_key:
    name: Spectra Interactable Test Source Key
    initial: "ble_button_single"
    max: 255
    mode: text

  spectra_interactable_test_transport:
    name: Spectra Interactable Test Transport
    initial: "ble"
    max: 255
    mode: text

  spectra_interactable_m3_candidate_interactable_id:
    name: Spectra Interactable M3 Candidate Interactable ID
    initial: "spectra_macro_pad_room"
    max: 255
    mode: text

  spectra_interactable_m3_candidate_input_event:
    name: Spectra Interactable M3 Candidate Input Event
    initial: "button_3"
    max: 255
    mode: text

  spectra_interactable_m3_candidate_transport:
    name: Spectra Interactable M3 Candidate Transport
    initial: "ble"
    max: 255
    mode: text

input_button:
  spectra_interactable_run_test_source_signal:
    name: Spectra Interactable Run Test Source Signal
    icon: mdi:flask-outline

  spectra_interactable_replay_last_event:
    name: Spectra Interactable Replay Last Event
    icon: mdi:history

  spectra_interactable_run_validation_bundle:
    name: Spectra Interactable Run Validation Bundle
    icon: mdi:playlist-check

  spectra_interactable_apply_cutover_profile:
    name: Spectra Interactable Apply Cutover Profile
    icon: mdi:tune-variant

  spectra_interactable_run_stress_test:
    name: Spectra Interactable Run Stress Test
    icon: mdi:rocket-launch

  spectra_interactable_activate_pilot_safe:
    name: Spectra Interactable Activate Pilot (Safe)
    icon: mdi:shield-check

  spectra_interactable_activate_active_safe:
    name: Spectra Interactable Activate Active (Safe)
    icon: mdi:shield-star

  spectra_interactable_capture_evidence_packet:
    name: Spectra Interactable Capture Evidence Packet
    icon: mdi:file-document-check-outline

  spectra_interactable_run_m3_candidate_test:
    name: Spectra Interactable Run M3 Candidate Test
    icon: mdi:shape-plus-outline

input_select:
  spectra_interactable_cutover_profile:
    name: Spectra Interactable Cutover Profile
    options:
      - disabled
      - shadow
      - pilot
      - active
    initial: disabled

input_number:
  spectra_interactable_last_ingest_ts_ms:
    name: Spectra Interactable Last Ingest TS ms
    min: 0
    max: 4102444800000
    step: 1
    initial: 0

  spectra_interactable_last_dispatch_ts_ms:
    name: Spectra Interactable Last Dispatch TS ms
    min: 0
    max: 4102444800000
    step: 1
    initial: 0

  spectra_interactable_last_dispatch_lag_ms:
    name: Spectra Interactable Last Dispatch Lag ms
    min: 0
    max: 600000
    step: 1
    initial: 0

  spectra_interactable_cutover_success_threshold_pct:
    name: Spectra Interactable Cutover Success Threshold %
    min: 0
    max: 100
    step: 0.1
    initial: 95

  spectra_interactable_cutover_dropped_threshold_pct:
    name: Spectra Interactable Cutover Dropped Threshold %
    min: 0
    max: 100
    step: 0.1
    initial: 5

  spectra_interactable_cutover_invalid_threshold_pct:
    name: Spectra Interactable Cutover Invalid Threshold %
    min: 0
    max: 100
    step: 0.1
    initial: 2

  spectra_interactable_stress_iterations:
    name: Spectra Interactable Stress Iterations
    min: 1
    max: 200
    step: 1
    initial: 20

  spectra_interactable_stress_delay_ms:
    name: Spectra Interactable Stress Delay ms
    min: 50
    max: 5000
    step: 10
    initial: 250

  spectra_interactable_cutover_soak_minutes:
    name: Spectra Interactable Cutover Soak Minutes
    min: 1
    max: 120
    step: 1
    initial: 10

  spectra_interactable_auto_remediation_max_per_hour:
    name: Spectra Interactable Auto Remediation Max Per Hour
    min: 1
    max: 20
    step: 1
    initial: 3

  spectra_interactable_remediation_cooldown_minutes:
    name: Spectra Interactable Remediation Cooldown Minutes
    min: 1
    max: 60
    step: 1
    initial: 10

  spectra_interactable_auto_promote_hold_minutes:
    name: Spectra Interactable Auto Promote Hold Minutes
    min: 1
    max: 60
    step: 1
    initial: 5

  spectra_interactable_cutover_ready_since_ts_ms:
    name: Spectra Interactable Cutover Ready Since TS ms
    min: 0
    max: 4102444800000
    step: 1
    initial: 0

  spectra_interactable_last_evidence_capture_ts_ms:
    name: Spectra Interactable Last Evidence Capture TS ms
    min: 0
    max: 4102444800000
    step: 1
    initial: 0

counter:
  spectra_interactable_events_total:
    name: Spectra Interactable Events Total
    initial: 0
    step: 1

  spectra_interactable_events_dispatched:
    name: Spectra Interactable Events Dispatched
    initial: 0
    step: 1

  spectra_interactable_events_invalid:
    name: Spectra Interactable Events Invalid
    initial: 0
    step: 1

  spectra_interactable_events_dropped:
    name: Spectra Interactable Events Dropped
    initial: 0
    step: 1

  spectra_interactable_auto_remediations:
    name: Spectra Interactable Auto Remediations
    initial: 0
    step: 1

timer:
  spectra_remote_wifi_maintenance_window:
    name: Spectra Remote Wi-Fi Maintenance Window
    duration: "00:10:00"

  spectra_interactable_remediation_cooldown:
    name: Spectra Interactable Remediation Cooldown
    duration: "00:10:00"

script:
  spectra_interactable_activate_active_safe:
    alias: Spectra Interactable - Activate Active (Safe)
    mode: restart
    sequence:
      - variables:
          active_ready: "{{ is_state('binary_sensor.spectra_interactable_active_preflight_ready', 'on') }}"
      - choose:
          - conditions: "{{ not active_ready }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "active_activation_blocked_preflight"
              - choose:
                  - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
                    sequence:
                      - service: persistent_notification.create
                        data:
                          notification_id: spectra_interactable_active_activation_blocked
                          title: "Spectra Interactables Active Activation Blocked"
                          message: >-
                            Active activation requires active preflight ready (cutover-ready + soak + quality thresholds).
                            Recommended profile: {{ states('sensor.spectra_interactable_recommended_profile') }}.
                            success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                            dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                            invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                            soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.
              - stop: "Active activation blocked because cutover readiness is off."
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "active"
      - service: script.spectra_interactable_apply_cutover_profile
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: ""
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_rollback
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_active_activation_blocked

  spectra_interactable_capture_evidence_packet:
    alias: Spectra Interactable - Capture Evidence Packet
    mode: restart
    sequence:
      - variables:
          verdict: "{{ states('sensor.spectra_interactable_cutover_evidence_verdict') | trim }}"
          blockers: "{{ states('sensor.spectra_interactable_cutover_evidence_blockers') | trim }}"
          now_ts_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_evidence_capture_ts_ms
          value: "{{ now_ts_ms }}"
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_evidence_verdict
          value: "{{ verdict[:255] }}"
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_evidence_blockers
          value: "{{ blockers[:255] }}"
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_evidence_packet
                  title: "Spectra Interactables Evidence Packet Captured"
                  message: >-
                    verdict={{ verdict }}
                    blockers={{ blockers if blockers not in ['', 'none', 'None'] else 'none' }}
                    profile={{ states('input_select.spectra_interactable_cutover_profile') }}
                    recommended={{ states('sensor.spectra_interactable_recommended_profile') }}
                    success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.

  spectra_interactable_run_m3_candidate_test:
    alias: Spectra Interactable - Run M3 Candidate Test
    mode: restart
    sequence:
      - variables:
          interactable_id: "{{ states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim }}"
          input_event: "{{ states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim }}"
          transport: "{{ states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim }}"
          event_valid: "{{ input_event in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] }}"
          transport_valid: "{{ transport in ['ble','wifi_api','unknown',''] }}"
      - choose:
          - conditions: >-
              {{ interactable_id in ['', 'unknown', 'unavailable'] or (not event_valid) or (not transport_valid) }}
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: >-
                    m3_candidate_invalid id={{ interactable_id }} event={{ input_event }} transport={{ transport }}
              - stop: "M3 candidate test blocked by invalid candidate contract fields."
      - service: script.spectra_interactable_process_event
        data:
          interactable_id: "{{ interactable_id }}"
          input_event: "{{ input_event }}"
          transport: "{{ transport if transport not in ['', 'unknown', 'unavailable'] else 'unknown' }}"
          correlation_id: >-
            m3-candidate-{{ now().timestamp() | int }}

  spectra_interactable_activate_pilot_safe:
    alias: Spectra Interactable - Activate Pilot (Safe)
    mode: restart
    sequence:
      - variables:
          pilot_ready: "{{ is_state('binary_sensor.spectra_interactable_pilot_preflight_ready', 'on') }}"
      - choose:
          - conditions: "{{ not pilot_ready }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "pilot_activation_blocked_preflight"
              - choose:
                  - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
                    sequence:
                      - service: persistent_notification.create
                        data:
                          notification_id: spectra_interactable_pilot_activation_blocked
                          title: "Spectra Interactables Pilot Activation Blocked"
                          message: >-
                            Pilot activation preflight is not ready.
                            Recommended profile: {{ states('sensor.spectra_interactable_recommended_profile') }}.
                            success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                            dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                            invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
              - stop: "Pilot activation blocked by preflight checks."
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "pilot"
      - service: script.spectra_interactable_apply_cutover_profile
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: ""

  spectra_interactable_apply_cutover_profile:
    alias: Spectra Interactable - Apply Cutover Profile
    mode: restart
    sequence:
      - variables:
          profile: "{{ states('input_select.spectra_interactable_cutover_profile') | lower | trim }}"
      - choose:
          - conditions: "{{ profile == 'disabled' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.spectra_interactable_bridge_enabled
                    - input_boolean.spectra_interactable_ble_button_single_source_enabled
                    - input_boolean.spectra_interactable_ble_arriving_source_enabled
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.spectra_interactable_shadow_mode

          - conditions: "{{ profile == 'shadow' }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.spectra_interactable_bridge_enabled
                    - input_boolean.spectra_interactable_shadow_mode
                    - input_boolean.spectra_interactable_ble_button_single_source_enabled
                    - input_boolean.spectra_interactable_ble_arriving_source_enabled

          - conditions: "{{ profile == 'pilot' }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.spectra_interactable_bridge_enabled
                    - input_boolean.spectra_interactable_shadow_mode
                    - input_boolean.spectra_interactable_ble_button_single_source_enabled
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.spectra_interactable_ble_arriving_source_enabled

          - conditions: "{{ profile == 'active' }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.spectra_interactable_bridge_enabled
                    - input_boolean.spectra_interactable_ble_button_single_source_enabled
                    - input_boolean.spectra_interactable_ble_arriving_source_enabled
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.spectra_interactable_shadow_mode

  spectra_interactable_run_stress_test:
    alias: Spectra Interactable - Run Stress Test
    mode: restart
    sequence:
      - variables:
          iterations: "{{ states('input_number.spectra_interactable_stress_iterations') | int(20) }}"
          delay_ms: "{{ states('input_number.spectra_interactable_stress_delay_ms') | int(250) }}"
      - repeat:
          count: "{{ iterations }}"
          sequence:
            - variables:
                source_key: >-
                  {{ 'ble_button_single' if (repeat.index % 2 == 1) else 'ble_arriving' }}
            - service: script.spectra_interactable_process_source_signal
              data:
                source_key: "{{ source_key }}"
                transport: "ble"
                correlation_id: >-
                  stress-{{ repeat.index }}-{{ now().timestamp() | int }}
            - delay:
                milliseconds: "{{ delay_ms }}"

  spectra_interactable_run_test_source_signal:
    alias: Spectra Interactable - Run Test Source Signal
    mode: restart
    sequence:
      - variables:
          source_key: "{{ states('input_text.spectra_interactable_test_source_key') | trim }}"
          transport: "{{ states('input_text.spectra_interactable_test_transport') | trim }}"
          correlation_id: >-
            test-src-{{ now().timestamp() | int }}
      - service: script.spectra_interactable_process_source_signal
        data:
          source_key: "{{ source_key if source_key not in ['', 'unknown', 'unavailable'] else 'ble_button_single' }}"
          transport: "{{ transport if transport not in ['', 'unknown', 'unavailable'] else 'ble' }}"
          correlation_id: "{{ correlation_id }}"

  spectra_interactable_replay_last_event:
    alias: Spectra Interactable - Replay Last Event
    mode: restart
    sequence:
      - variables:
          interactable_id: "{{ states('input_text.spectra_interactable_last_interactable_id') | trim }}"
          input_event: "{{ states('input_text.spectra_interactable_last_input_event') | trim }}"
          transport: "{{ states('input_text.spectra_interactable_last_transport') | trim }}"
          correlation_id: >-
            replay-{{ now().timestamp() | int }}
      - choose:
          - conditions: >-
              {{ interactable_id in ['', 'unknown', 'unavailable'] or input_event in ['', 'unknown', 'unavailable'] }}
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "replay_missing_last_event"
              - stop: "No valid last event available for replay."
      - service: script.spectra_interactable_process_event
        data:
          interactable_id: "{{ interactable_id }}"
          input_event: "{{ input_event }}"
          transport: "{{ transport if transport not in ['', 'unknown', 'unavailable'] else 'unknown' }}"
          correlation_id: "{{ correlation_id }}"
          dry_run: true

  spectra_interactable_run_validation_bundle:
    alias: Spectra Interactable - Run Validation Bundle
    mode: restart
    sequence:
      - service: script.spectra_interactable_process_source_signal
        data:
          source_key: "ble_button_single"
          transport: "ble"
          correlation_id: >-
            bundle-btn-single-{{ now().timestamp() | int }}
      - delay: "00:00:01"
      - service: script.spectra_interactable_process_source_signal
        data:
          source_key: "ble_arriving"
          transport: "ble"
          correlation_id: >-
            bundle-arriving-{{ now().timestamp() | int }}
      - delay: "00:00:01"
      - service: script.spectra_interactable_replay_last_event

  spectra_interactable_process_source_signal:
    alias: Spectra Interactable - Process Source Signal
    mode: queued
    max: 50
    fields:
      source_key:
        description: Source mapping key from source-map JSON
        example: "ble_button_single"
      transport:
        description: Event transport lane (ble/wifi_api)
        example: "ble"
      correlation_id:
        description: Optional event correlation ID
        example: "evt-1721301123"
    sequence:
      - variables:
          source_key_norm: "{{ source_key | default('', true) | string | lower | trim }}"
          transport_norm: "{{ transport | default('unknown', true) | string | lower | trim }}"
          correlation_id_norm: "{{ correlation_id | default('', true) | string | trim }}"
          map_raw: "{{ states('input_text.spectra_interactable_source_map_json') | trim }}"
          map_valid: >-
            {{ map_raw not in ['', 'unknown', 'unavailable', 'none', 'None'] and (map_raw.startswith('{')) }}
          source_map: >-
            {% if map_valid %}
              {{ map_raw | from_json }}
            {% else %}
              {{ dict() }}
            {% endif %}
          source_spec: >-
            {% if source_key_norm in source_map %}
              {{ source_map[source_key_norm] }}
            {% else %}
              {{ dict() }}
            {% endif %}
          has_source_spec: >-
            {{ source_spec is mapping and (source_spec | count) > 0 }}
          mapped_interactable_id: "{{ source_spec.interactable_id if has_source_spec else '' }}"
          mapped_input_event: "{{ source_spec.input_event if has_source_spec else '' }}"
          mapped_target_hint: "{{ source_spec.target_hint if has_source_spec else '' }}"
          mapped_delta: "{{ source_spec.delta if has_source_spec and source_spec.delta is defined else none }}"
          mapped_dry_run: "{{ source_spec.dry_run if has_source_spec and source_spec.dry_run is defined else false }}"

      - choose:
          - conditions: "{{ not has_source_spec or mapped_input_event == '' }}"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "source_mapping_missing source={{ source_key_norm }}"
              - stop: "No interactable source mapping found."

      - choose:
          - conditions: "{{ mapped_delta is not none }}"
            sequence:
              - service: script.spectra_interactable_process_event
                data:
                  interactable_id: "{{ mapped_interactable_id }}"
                  input_event: "{{ mapped_input_event }}"
                  target_hint: "{{ mapped_target_hint }}"
                  delta: "{{ mapped_delta }}"
                  transport: "{{ transport_norm }}"
                  correlation_id: "{{ correlation_id_norm }}"
                  dry_run: "{{ mapped_dry_run }}"
        default:
          - service: script.spectra_interactable_process_event
            data:
              interactable_id: "{{ mapped_interactable_id }}"
              input_event: "{{ mapped_input_event }}"
              target_hint: "{{ mapped_target_hint }}"
              transport: "{{ transport_norm }}"
              correlation_id: "{{ correlation_id_norm }}"
              dry_run: "{{ mapped_dry_run }}"

  spectra_interactable_process_event:
    alias: Spectra Interactable - Process Event
    mode: queued
    max: 50
    fields:
      interactable_id:
        description: Stable interactable source ID
        example: "spectra_remote_primary"
      input_event:
        description: Canonical control-center input event key
        example: "encoder_turn"
      delta:
        description: Optional signed delta for turn events
        example: "1"
      target_hint:
        description: Optional target hint for diagnostics
        example: "media_player.kitchen_wiim"
      correlation_id:
        description: Optional event correlation ID
        example: "evt-1721301123"
      transport:
        description: Event transport lane (ble/wifi_api)
        example: "ble"
      dry_run:
        description: Optional explicit dry-run override
        example: "false"
    sequence:
      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_events_total

      - variables:
          now_ts_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
          interactable_id_norm: "{{ interactable_id | default('unknown', true) | string | lower | trim }}"
          input_event_norm: "{{ input_event | default('', true) | string | lower | trim }}"
          target_hint_norm: "{{ target_hint | default('', true) | string | trim }}"
          correlation_id_norm: "{{ correlation_id | default('', true) | string | trim }}"
          transport_norm: "{{ transport | default('unknown', true) | string | lower | trim }}"
          valid_event: >-
            {{ input_event_norm in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] }}
          valid_transport: >-
            {{ transport_norm in ['ble','wifi_api','unknown',''] }}
          has_delta: >-
            {{ delta is defined and (delta | string | trim) not in ['','none','null','None'] }}
          delta_value: >-
            {% if delta is defined and (delta | string | trim) not in ['','none','null','None'] %}
              {{ delta | int(0) }}
            {% else %}
              0
            {% endif %}
          bridge_enabled: "{{ is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') }}"
          shadow_mode: "{{ is_state('input_boolean.spectra_interactable_shadow_mode', 'on') }}"
          dedupe_enabled: "{{ is_state('input_boolean.spectra_interactable_dedupe_enabled', 'on') }}"
          last_corr: "{{ states('input_text.spectra_interactable_last_correlation_id') | trim }}"
          duplicate_corr: >-
            {{ dedupe_enabled and correlation_id_norm != '' and correlation_id_norm == last_corr }}
          dry_run_effective: >-
            {{ shadow_mode or (dry_run | default(false)) }}
          event_json: >-
            {{ {
              'interactable_id': interactable_id_norm,
              'input_event': input_event_norm,
              'delta': (delta_value if has_delta else none),
              'target_hint': target_hint_norm,
              'correlation_id': correlation_id_norm,
              'transport': transport_norm,
              'bridge_enabled': bridge_enabled,
              'shadow_mode': shadow_mode,
              'dry_run_effective': dry_run_effective
            } | tojson }}

      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_ingest_ts_ms
          value: "{{ now_ts_ms }}"

      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_event_json
          value: "{{ event_json[:255] }}"

      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_interactable_id
          value: "{{ interactable_id_norm[:255] }}"

      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_input_event
          value: "{{ input_event_norm[:255] }}"

      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_transport
          value: "{{ transport_norm[:255] }}"

      - choose:
          - conditions: "{{ not valid_event or not valid_transport }}"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: >-
                    invalid_event_or_transport event={{ input_event_norm }} transport={{ transport_norm }}
              - stop: "Invalid interactable event payload."

          - conditions: "{{ duplicate_corr }}"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_dropped
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "dropped_duplicate correlation_id={{ correlation_id_norm }}"
              - stop: "Duplicate interactable event dropped by correlation-id dedupe."

          - conditions: "{{ not bridge_enabled }}"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_dropped
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "bridge_disabled"
              - stop: "Interactable bridge disabled."

      - choose:
          - conditions: "{{ has_delta }}"
            sequence:
              - service: spectra_ls.execute_control_center_input
                data:
                  input_event: "{{ input_event_norm }}"
                  dry_run: "{{ dry_run_effective }}"
                  target_hint: "{{ target_hint_norm }}"
                  delta: "{{ delta_value }}"
                  correlation_id: "{{ correlation_id_norm }}"
        default:
          - service: spectra_ls.execute_control_center_input
            data:
              input_event: "{{ input_event_norm }}"
              dry_run: "{{ dry_run_effective }}"
              target_hint: "{{ target_hint_norm }}"
              correlation_id: "{{ correlation_id_norm }}"

      - variables:
          dispatch_ts_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
          dispatch_lag_ms: >-
            {{ (dispatch_ts_ms | int(0)) - (now_ts_ms | int(0)) }}

      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_dispatch_ts_ms
          value: "{{ dispatch_ts_ms }}"

      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_dispatch_lag_ms
          value: "{{ dispatch_lag_ms if dispatch_lag_ms >= 0 else 0 }}"

      - choose:
          - conditions: "{{ input_event_norm == 'encoder_long_press' and interactable_id_norm.startswith('spectra_remote') }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.spectra_remote_wifi_maintenance_enabled
              - service: timer.start
                target:
                  entity_id: timer.spectra_remote_wifi_maintenance_window

      - choose:
          - conditions: "{{ correlation_id_norm != '' }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_correlation_id
                  value: "{{ correlation_id_norm[:255] }}"

      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: ""

      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_events_dispatched

automation:
  - id: spectra_interactable_event_bridge_ingest
    alias: "Spectra: Interactable Event Bridge Ingest"
    mode: queued
    max: 50
    trigger:
      - platform: event
        event_type: spectra_ls_interactable_event
    action:
      - service: script.spectra_interactable_process_event
        data:
          interactable_id: "{{ trigger.event.data.interactable_id | default('unknown', true) }}"
          input_event: "{{ trigger.event.data.input_event | default('', true) }}"
          delta: "{{ trigger.event.data.delta | default('', true) }}"
          target_hint: "{{ trigger.event.data.target_hint | default('', true) }}"
          correlation_id: "{{ trigger.event.data.correlation_id | default('', true) }}"
          transport: "{{ trigger.event.data.transport | default('unknown', true) }}"
          dry_run: "{{ trigger.event.data.dry_run | default(false) }}"

  - id: spectra_remote_wifi_maintenance_window_expire
    alias: "Spectra: Remote Wi-Fi Maintenance Window Expire"
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.spectra_remote_wifi_maintenance_window
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.spectra_remote_wifi_maintenance_enabled

  - id: spectra_interactable_ble_button_single_source_bridge
    alias: "Spectra: BLE Button-Single Source to Interactable Bridge"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.ble_presence_door_cory_ble_button_single
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.spectra_interactable_ble_button_single_source_enabled
        state: "on"
    action:
      - service: script.spectra_interactable_process_source_signal
        data:
          source_key: "ble_button_single"
          transport: "ble"
          correlation_id: >-
            ble-btn-single-{{ trigger.to_state.last_changed.timestamp() | int }}

  - id: spectra_interactable_ble_arriving_source_bridge
    alias: "Spectra: BLE Arriving Source to Interactable Bridge"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.ble_presence_door_cory_ble_arriving
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.spectra_interactable_ble_arriving_source_enabled
        state: "on"
    action:
      - service: script.spectra_interactable_process_source_signal
        data:
          source_key: "ble_arriving"
          transport: "ble"
          correlation_id: >-
            ble-arriving-{{ trigger.to_state.last_changed.timestamp() | int }}

  - id: spectra_interactable_test_source_signal_button
    alias: "Spectra: Interactable Test Source Signal Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_run_test_source_signal
    action:
      - service: script.spectra_interactable_run_test_source_signal

  - id: spectra_interactable_replay_last_event_button
    alias: "Spectra: Interactable Replay Last Event Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_replay_last_event
    action:
      - service: script.spectra_interactable_replay_last_event

  - id: spectra_interactable_run_validation_bundle_button
    alias: "Spectra: Interactable Run Validation Bundle Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_run_validation_bundle
    action:
      - service: script.spectra_interactable_run_validation_bundle

  - id: spectra_interactable_apply_cutover_profile_button
    alias: "Spectra: Interactable Apply Cutover Profile Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_apply_cutover_profile
    action:
      - service: script.spectra_interactable_apply_cutover_profile

  - id: spectra_interactable_run_stress_test_button
    alias: "Spectra: Interactable Run Stress Test Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_run_stress_test
    action:
      - service: script.spectra_interactable_run_stress_test

  - id: spectra_interactable_activate_pilot_safe_button
    alias: "Spectra: Interactable Activate Pilot Safe Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_activate_pilot_safe
    action:
      - service: script.spectra_interactable_activate_pilot_safe

  - id: spectra_interactable_activate_active_safe_button
    alias: "Spectra: Interactable Activate Active Safe Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_activate_active_safe
    action:
      - service: script.spectra_interactable_activate_active_safe

  - id: spectra_interactable_capture_evidence_packet_button
    alias: "Spectra: Interactable Capture Evidence Packet Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_capture_evidence_packet
    action:
      - service: script.spectra_interactable_capture_evidence_packet

  - id: spectra_interactable_run_m3_candidate_test_button
    alias: "Spectra: Interactable Run M3 Candidate Test Button"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.spectra_interactable_run_m3_candidate_test
    action:
      - service: script.spectra_interactable_run_m3_candidate_test

  - id: spectra_interactable_cutover_safety_rollback
    alias: "Spectra: Interactable Cutover Safety Rollback"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
        to: "off"
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: binary_sensor.spectra_interactable_bridge_active
        state: "on"
      - condition: state
        entity_id: timer.spectra_interactable_remediation_cooldown
        state: "idle"
      - condition: template
        value_template: >-
          {{ (states('counter.spectra_interactable_auto_remediations') | int(0)) <
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "shadow"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.spectra_interactable_shadow_mode
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: "cutover_safety_rollback_triggered"
      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_auto_remediations
      - service: timer.start
        data:
          entity_id: timer.spectra_interactable_remediation_cooldown
          duration: >-
            00:{{ '%02d' | format(states('input_number.spectra_interactable_remediation_cooldown_minutes') | int(10)) }}:00
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_rollback
                  title: "Spectra Interactables Safety Rollback Triggered"
                  message: >-
                    Bridge was reverted to shadow mode after sustained cutover-readiness failure.
                    success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    lag_ms={{ states('sensor.spectra_interactable_last_dispatch_lag_ms') }}.

  - id: spectra_interactable_quality_spike_auto_remediate
    alias: "Spectra: Interactable Quality Spike Auto Remediate"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set bridge_enabled = is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
          {% set dropped = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set dropped_thr = (states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5)) + 5 %}
          {% set invalid_thr = (states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2)) + 2 %}
          {{ bridge_enabled and (dropped > dropped_thr or invalid > invalid_thr) }}
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: timer.spectra_interactable_remediation_cooldown
        state: "idle"
      - condition: template
        value_template: >-
          {{ (states('counter.spectra_interactable_auto_remediations') | int(0)) <
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "shadow"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.spectra_interactable_shadow_mode
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: "auto_remediate_quality_spike"
      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_auto_remediations
      - service: timer.start
        data:
          entity_id: timer.spectra_interactable_remediation_cooldown
          duration: >-
            00:{{ '%02d' | format(states('input_number.spectra_interactable_remediation_cooldown_minutes') | int(10)) }}:00
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_auto_remediate
                  title: "Spectra Interactables Auto-Remediation Applied"
                  message: >-
                    Quality spike triggered automatic shadow fallback.
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    remediation_count={{ states('counter.spectra_interactable_auto_remediations') }}.

  - id: spectra_interactable_quality_spike_remediation_suppressed
    alias: "Spectra: Interactable Quality Spike Remediation Suppressed"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set bridge_enabled = is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
          {% set dropped = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set dropped_thr = (states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5)) + 5 %}
          {% set invalid_thr = (states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2)) + 2 %}
          {{ bridge_enabled and (dropped > dropped_thr or invalid > invalid_thr) }}
        for:
          minutes: 1
    condition:
      - condition: template
        value_template: >-
          {{ is_state('timer.spectra_interactable_remediation_cooldown', 'active') or
             (states('counter.spectra_interactable_auto_remediations') | int(0)) >=
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
      - condition: state
        entity_id: input_boolean.spectra_interactable_rollback_notifications_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: spectra_interactable_auto_remediate_suppressed
          title: "Spectra Interactables Remediation Suppressed"
          message: >-
            Quality spike detected but remediation is suppressed by cooldown/rate limit.
            cooldown={{ states('timer.spectra_interactable_remediation_cooldown') }}
            remediation_count={{ states('counter.spectra_interactable_auto_remediations') }}
            max_per_hour={{ states('input_number.spectra_interactable_auto_remediation_max_per_hour') }}.

  - id: spectra_interactable_cutover_ready_since_tracker
    alias: "Spectra: Interactable Cutover Ready Since Tracker"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
    action:
      - choose:
          - conditions: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              - service: input_number.set_value
                data:
                  entity_id: input_number.spectra_interactable_cutover_ready_since_ts_ms
                  value: "{{ (as_timestamp(now()) * 1000) | int }}"
        default:
          - service: input_number.set_value
            data:
              entity_id: input_number.spectra_interactable_cutover_ready_since_ts_ms
              value: 0

  - id: spectra_interactable_hourly_remediation_counter_reset
    alias: "Spectra: Interactable Hourly Remediation Counter Reset"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "0"
    action:
      - service: counter.reset
        target:
          entity_id: counter.spectra_interactable_auto_remediations

  - id: spectra_interactable_cutover_ready_notification_cleanup
    alias: "Spectra: Interactable Cutover Ready Notification Cleanup"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
        to: "on"
        for:
          minutes: 1
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_rollback
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_pilot_activation_blocked
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_active_activation_blocked
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_auto_remediate
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_auto_remediate_suppressed

  - id: spectra_interactable_active_promotion_recommendation
    alias: "Spectra: Interactable Active Promotion Recommendation"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_active_preflight_ready
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_select.spectra_interactable_cutover_profile
        state: "pilot"
      - condition: state
        entity_id: input_boolean.spectra_interactable_rollback_notifications_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: spectra_interactable_active_promotion_recommended
          title: "Spectra Interactables Active Promotion Ready"
          message: >-
            Pilot is meeting active preflight gates.
            You can run 'Activate Active (Safe)' now, or enable auto-promote.
            soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}
            success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
            dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
            invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%.

  - id: spectra_interactable_auto_promote_active
    alias: "Spectra: Interactable Auto Promote Active"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: input_boolean.spectra_interactable_auto_promote_active_enabled
        state: "on"
      - condition: state
        entity_id: input_select.spectra_interactable_cutover_profile
        state: "pilot"
      - condition: state
        entity_id: binary_sensor.spectra_interactable_active_preflight_ready
        state: "on"
      - condition: template
        value_template: >-
          {% set soak = states('input_number.spectra_interactable_cutover_soak_minutes') | float(10) %}
          {% set hold = states('input_number.spectra_interactable_auto_promote_hold_minutes') | float(5) %}
          {% set age_s = states('sensor.spectra_interactable_cutover_ready_soak_age_s') | float(0) %}
          {{ age_s >= ((soak + hold) * 60) }}
    action:
      - service: script.spectra_interactable_activate_active_safe
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_auto_promoted_active
                  title: "Spectra Interactables Auto-Promoted to Active"
                  message: >-
                    Auto-promote moved profile from pilot to active after sustained preflight hold.
                    soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.

  - id: spectra_interactable_profile_change_notification_cleanup
    alias: "Spectra: Interactable Profile Change Notification Cleanup"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.spectra_interactable_cutover_profile
    action:
      - choose:
          - conditions: "{{ trigger.to_state.state != 'pilot' }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_active_promotion_recommended
      - choose:
          - conditions: "{{ trigger.to_state.state != 'active' }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_auto_promoted_active
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_evidence_packet

template:
  - sensor:
      - name: Spectra Interactable M3 Candidate Contract
        icon: mdi:shape-outline
        state: >-
          {% set iid = states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim %}
          {% set evt = states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim %}
          {% set trn = states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim %}
          {% set valid_evt = evt in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] %}
          {% set valid_trn = trn in ['ble','wifi_api','unknown',''] %}
          {% set valid_id = iid not in ['', 'unknown', 'unavailable'] and iid.startswith('spectra_') %}
          {{ iid if valid_id else 'invalid_id' }}|{{ evt if valid_evt else 'invalid_event' }}|{{ trn if valid_trn else 'invalid_transport' }}
        attributes:
          interactable_id: "{{ states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim }}"
          input_event: "{{ states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim }}"
          transport: "{{ states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim }}"
          candidate_valid: "{{ is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') }}"
          profile: "{{ states('input_select.spectra_interactable_cutover_profile') }}"

      - name: Spectra Interactable M3 Generalization Status
        icon: mdi:progress-wrench
        state: >-
          {% set candidate_valid = is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') %}
          {% set profile = states('input_select.spectra_interactable_cutover_profile') | lower %}
          {% if not candidate_valid %}
            candidate_invalid
          {% elif profile in ['shadow', 'pilot', 'active'] %}
            ready_for_multi_interactable_validation
          {% else %}
            ready_but_profile_disabled
          {% endif %}

              - name: Spectra Interactable Cutover Evidence Blockers
                icon: mdi:alert-box-outline
                state: >-
                  {% set ns = namespace(items=[]) %}
                  {% if not is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
                    {% set ns.items = ns.items + ['bridge_disabled'] %}
                  {% endif %}
                  {% if not is_state('binary_sensor.spectra_interactable_source_intake_enabled', 'on') %}
                    {% set ns.items = ns.items + ['source_intake_off'] %}
                  {% endif %}
                  {% if not is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') %}
                    {% set ns.items = ns.items + ['cutover_not_ready'] %}
                  {% endif %}
                  {% if not is_state('binary_sensor.spectra_interactable_cutover_ready_soaked', 'on') %}
                    {% set ns.items = ns.items + ['soak_not_satisfied'] %}
                  {% endif %}
                  {% if not is_state('binary_sensor.spectra_interactable_active_preflight_ready', 'on') %}
                    {% set ns.items = ns.items + ['active_preflight_not_ready'] %}
                  {% endif %}
                  {% if is_state('timer.spectra_interactable_remediation_cooldown', 'active') %}
                    {% set ns.items = ns.items + ['remediation_cooldown_active'] %}
                  {% endif %}
                  {% set rem_count = states('counter.spectra_interactable_auto_remediations') | int(0) %}
                  {% set rem_max = states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3) %}
                  {% if rem_count >= rem_max %}
                    {% set ns.items = ns.items + ['remediation_rate_limited'] %}
                  {% endif %}
                  {% if ns.items | count == 0 %}
                    none
                  {% else %}
                    {{ ns.items | join('|') }}
                  {% endif %}

              - name: Spectra Interactable Cutover Evidence Verdict
                icon: mdi:clipboard-check-outline
                state: >-
                  {% set profile = states('input_select.spectra_interactable_cutover_profile') | lower %}
                  {% set blockers = states('sensor.spectra_interactable_cutover_evidence_blockers') %}
                  {% if blockers == 'none' and profile == 'active' %}
                    go_active_confirmed
                  {% elif blockers == 'none' and profile == 'pilot' %}
                    go_active_ready
                  {% elif blockers == 'none' %}
                    go_pilot_or_active
                  {% else %}
                    no_go
                  {% endif %}
                attributes:
                  profile: "{{ states('input_select.spectra_interactable_cutover_profile') }}"
                  recommended_profile: "{{ states('sensor.spectra_interactable_recommended_profile') }}"
                  blockers: "{{ states('sensor.spectra_interactable_cutover_evidence_blockers') }}"
                  bridge_active: "{{ states('binary_sensor.spectra_interactable_bridge_active') }}"
                  source_intake_enabled: "{{ states('binary_sensor.spectra_interactable_source_intake_enabled') }}"
                  cutover_ready: "{{ states('binary_sensor.spectra_interactable_cutover_ready') }}"
                  cutover_ready_soaked: "{{ states('binary_sensor.spectra_interactable_cutover_ready_soaked') }}"
                  active_preflight_ready: "{{ states('binary_sensor.spectra_interactable_active_preflight_ready') }}"
                  promotion_assist_status: "{{ states('sensor.spectra_interactable_promotion_assist_status') }}"
                  success_pct: "{{ states('sensor.spectra_interactable_dispatch_success_pct') }}"
                  dropped_pct: "{{ states('sensor.spectra_interactable_dropped_pct') }}"
                  invalid_pct: "{{ states('sensor.spectra_interactable_invalid_pct') }}"
                  last_dispatch_lag_ms: "{{ states('sensor.spectra_interactable_last_dispatch_lag_ms') }}"
                  soak_age_s: "{{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}"
                  cutover_soak_minutes: "{{ states('input_number.spectra_interactable_cutover_soak_minutes') }}"
                  remediation_count_hour: "{{ states('counter.spectra_interactable_auto_remediations') }}"
                  remediation_max_per_hour: "{{ states('input_number.spectra_interactable_auto_remediation_max_per_hour') }}"
                  remediation_cooldown_state: "{{ states('timer.spectra_interactable_remediation_cooldown') }}"
                  last_evidence_capture_ts_ms: "{{ states('input_number.spectra_interactable_last_evidence_capture_ts_ms') }}"

      - name: Spectra Interactable Cutover Ready Soak Age S
        unit_of_measurement: "s"
        icon: mdi:timer-outline
        state: >-
          {% set ts = states('input_number.spectra_interactable_cutover_ready_since_ts_ms') | float(0) %}
          {% if ts <= 0 or not is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') %}
            0
          {% else %}
            {{ ((as_timestamp(now()) * 1000 - ts) / 1000) | round(1) }}
          {% endif %}

      - name: Spectra Interactable Recommended Profile
        icon: mdi:compass-outline
        state: >-
          {% set bridge_enabled = is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
          {% set intake = is_state('binary_sensor.spectra_interactable_source_intake_enabled', 'on') %}
          {% set cutover_ready = is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') %}
          {% set soaked = is_state('binary_sensor.spectra_interactable_cutover_ready_soaked', 'on') %}
          {% set success_pct = states('sensor.spectra_interactable_dispatch_success_pct') | float(0) %}
          {% set dropped_pct = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid_pct = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% if not bridge_enabled %}
            disabled
          {% elif not intake %}
            shadow
          {% elif cutover_ready and soaked and success_pct >= 98 and dropped_pct <= 2 and invalid_pct <= 1 %}
            active
          {% elif is_state('binary_sensor.spectra_interactable_pilot_preflight_ready', 'on') %}
            pilot
          {% else %}
            shadow
          {% endif %}

      - name: Spectra Interactable Dispatch Success Pct
        unit_of_measurement: "%"
        icon: mdi:check-decagram
        state: >-
          {% set total = states('counter.spectra_interactable_events_total') | int(0) %}
          {% set dispatched = states('counter.spectra_interactable_events_dispatched') | int(0) %}
          {% if total <= 0 %}
            0
          {% else %}
            {{ ((dispatched / total) * 100) | round(1) }}
          {% endif %}

      - name: Spectra Interactable Dropped Pct
        unit_of_measurement: "%"
        icon: mdi:arrow-down-bold-circle
        state: >-
          {% set total = states('counter.spectra_interactable_events_total') | int(0) %}
          {% set dropped = states('counter.spectra_interactable_events_dropped') | int(0) %}
          {% if total <= 0 %}
            0
          {% else %}
            {{ ((dropped / total) * 100) | round(1) }}
          {% endif %}

      - name: Spectra Interactable Invalid Pct
        unit_of_measurement: "%"
        icon: mdi:alert-circle
        state: >-
          {% set total = states('counter.spectra_interactable_events_total') | int(0) %}
          {% set invalid = states('counter.spectra_interactable_events_invalid') | int(0) %}
          {% if total <= 0 %}
            0
          {% else %}
            {{ ((invalid / total) * 100) | round(1) }}
          {% endif %}

      - name: Spectra Interactable Last Event Summary
        icon: mdi:timeline-text-outline
        state: >-
          {% set src = states('input_text.spectra_interactable_last_interactable_id') | trim %}
          {% set evt = states('input_text.spectra_interactable_last_input_event') | trim %}
          {% set trn = states('input_text.spectra_interactable_last_transport') | trim %}
          {% if src in ['', 'unknown', 'unavailable'] and evt in ['', 'unknown', 'unavailable'] %}
            none
          {% else %}
            {{ src if src not in ['', 'unknown', 'unavailable'] else 'unknown_source' }}|{{ evt if evt not in ['', 'unknown', 'unavailable'] else 'unknown_event' }}|{{ trn if trn not in ['', 'unknown', 'unavailable'] else 'unknown_transport' }}
          {% endif %}

      - name: Spectra Interactable Last Event Age S
        unit_of_measurement: "s"
        icon: mdi:timer-sand
        state: >-
          {% set ingest_ts = states('input_number.spectra_interactable_last_ingest_ts_ms') | float(0) %}
          {% if ingest_ts <= 0 %}
            0
          {% else %}
            {{ ((as_timestamp(now()) * 1000 - ingest_ts) / 1000) | round(2) }}
          {% endif %}

      - name: Spectra Interactable Last Dispatch Lag ms
        unit_of_measurement: "ms"
        icon: mdi:speedometer
        state: >-
          {{ states('input_number.spectra_interactable_last_dispatch_lag_ms') | float(0) | round(1) }}

  - binary_sensor:
      - name: Spectra Interactable M3 Candidate Valid
        icon: mdi:shield-check
        state: >-
          {% set iid = states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim %}
          {% set evt = states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim %}
          {% set trn = states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim %}
          {% set valid_id = iid not in ['', 'unknown', 'unavailable'] and iid.startswith('spectra_') %}
          {% set valid_evt = evt in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] %}
          {% set valid_trn = trn in ['ble','wifi_api','unknown',''] %}
          {{ valid_id and valid_evt and valid_trn }}

      - name: Spectra Interactable Bridge Active
        icon: mdi:bridge
        state: >-
          {{ is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') and not is_state('input_boolean.spectra_interactable_shadow_mode', 'on') }}

      - name: Spectra Interactable Source Intake Enabled
        icon: mdi:connection
        state: >-
          {{ is_state('input_boolean.spectra_interactable_ble_button_single_source_enabled', 'on') or is_state('input_boolean.spectra_interactable_ble_arriving_source_enabled', 'on') }}

      - name: Spectra Interactable Cutover Ready
        icon: mdi:flag-checkered
        state: >-
          {% set active = is_state('binary_sensor.spectra_interactable_bridge_active', 'on') %}
          {% set intake = is_state('binary_sensor.spectra_interactable_source_intake_enabled', 'on') %}
          {% set success_pct = states('sensor.spectra_interactable_dispatch_success_pct') | float(0) %}
          {% set dropped_pct = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid_pct = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set success_min = states('input_number.spectra_interactable_cutover_success_threshold_pct') | float(95) %}
          {% set drop_max = states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5) %}
          {% set invalid_max = states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2) %}
          {{ active and intake and success_pct >= success_min and dropped_pct <= drop_max and invalid_pct <= invalid_max }}

      - name: Spectra Interactable Pilot Preflight Ready
        icon: mdi:shield-check-outline
        state: >-
          {% set intake = is_state('binary_sensor.spectra_interactable_source_intake_enabled', 'on') %}
          {% set total = states('counter.spectra_interactable_events_total') | int(0) %}
          {% set success_pct = states('sensor.spectra_interactable_dispatch_success_pct') | float(0) %}
          {% set dropped_pct = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid_pct = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set success_min_cfg = states('input_number.spectra_interactable_cutover_success_threshold_pct') | float(95) %}
          {% set drop_max_cfg = states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5) %}
          {% set invalid_max_cfg = states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2) %}
          {% set success_min = [90, success_min_cfg - 5] | max %}
          {% set drop_max = [10, drop_max_cfg + 5] | min %}
          {% set invalid_max = [5, invalid_max_cfg + 2] | min %}
          {{ intake and total >= 5 and success_pct >= success_min and dropped_pct <= drop_max and invalid_pct <= invalid_max }}

      - name: Spectra Interactable Cutover Ready Soaked
        icon: mdi:timer-check-outline
        state: >-
          {% set soak_age = states('sensor.spectra_interactable_cutover_ready_soak_age_s') | float(0) %}
          {% set soak_minutes = states('input_number.spectra_interactable_cutover_soak_minutes') | float(10) %}
          {{ is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') and soak_age >= (soak_minutes * 60) }}

      - name: Spectra Interactable Active Preflight Ready
        icon: mdi:shield-star-outline
        state: >-
          {{ is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') and
             is_state('binary_sensor.spectra_interactable_cutover_ready_soaked', 'on') }}

      - name: Spectra Interactable Promotion Assist Status
        icon: mdi:progress-check
        state: >-
          {% set profile = states('input_select.spectra_interactable_cutover_profile') | lower %}
          {% set preflight = is_state('binary_sensor.spectra_interactable_active_preflight_ready', 'on') %}
          {% set auto = is_state('input_boolean.spectra_interactable_auto_promote_active_enabled', 'on') %}
          {% if profile == 'active' %}
            active
          {% elif profile == 'pilot' and preflight and auto %}
            pilot_auto_promote_armed
          {% elif profile == 'pilot' and preflight %}
            pilot_ready_for_active
          {% elif profile == 'pilot' %}
            pilot_waiting_preflight
          {% else %}
            not_in_pilot
          {% endif %}
