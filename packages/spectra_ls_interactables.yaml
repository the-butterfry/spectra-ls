  - id: spectra_interactable_cutover_safety_rollback
    alias: "Spectra: Interactable Cutover Safety Rollback"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
        to: "off"
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: binary_sensor.spectra_interactable_bridge_active
        state: "on"
      - condition: state
        entity_id: timer.spectra_interactable_remediation_cooldown
        state: "idle"
      - condition: template
        value_template: >-
          {{ (states('counter.spectra_interactable_auto_remediations') | int(0)) <
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "shadow"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.spectra_interactable_shadow_mode
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: "cutover_safety_rollback_triggered"
      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_auto_remediations
      - service: timer.start
        data:
          entity_id: timer.spectra_interactable_remediation_cooldown
          duration: >-
            00:{{ '%02d' | format(states('input_number.spectra_interactable_remediation_cooldown_minutes') | int(10)) }}:00
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_rollback
                  title: "Spectra Interactables Safety Rollback Triggered"
                  message: >-
                    Bridge was reverted to shadow mode after sustained cutover-readiness failure.
                    success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    lag_ms={{ states('sensor.spectra_interactable_last_dispatch_lag_ms') }}.

  - id: spectra_interactable_quality_spike_auto_remediate
    alias: "Spectra: Interactable Quality Spike Auto Remediate"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set bridge_enabled = is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
          {% set dropped = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set dropped_thr = (states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5)) + 5 %}
          {% set invalid_thr = (states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2)) + 2 %}
          {{ bridge_enabled and (dropped > dropped_thr or invalid > invalid_thr) }}
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: timer.spectra_interactable_remediation_cooldown
        state: "idle"
      - condition: template
        value_template: >-
          {{ (states('counter.spectra_interactable_auto_remediations') | int(0)) <
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
    action:
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "shadow"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.spectra_interactable_shadow_mode
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: "auto_remediate_quality_spike"
      - service: counter.increment
        target:
          entity_id: counter.spectra_interactable_auto_remediations
      - service: timer.start
        data:
          entity_id: timer.spectra_interactable_remediation_cooldown
          duration: >-
            00:{{ '%02d' | format(states('input_number.spectra_interactable_remediation_cooldown_minutes') | int(10)) }}:00
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_auto_remediate
                  title: "Spectra Interactables Auto-Remediation Applied"
                  message: >-
                    Quality spike triggered automatic shadow fallback.
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    remediation_count={{ states('counter.spectra_interactable_auto_remediations') }}.

  - id: spectra_interactable_quality_spike_remediation_suppressed
    alias: "Spectra: Interactable Quality Spike Remediation Suppressed"
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set bridge_enabled = is_state('input_boolean.spectra_interactable_bridge_enabled', 'on') %}
          {% set dropped = states('sensor.spectra_interactable_dropped_pct') | float(0) %}
          {% set invalid = states('sensor.spectra_interactable_invalid_pct') | float(0) %}
          {% set dropped_thr = (states('input_number.spectra_interactable_cutover_dropped_threshold_pct') | float(5)) + 5 %}
          {% set invalid_thr = (states('input_number.spectra_interactable_cutover_invalid_threshold_pct') | float(2)) + 2 %}
          {{ bridge_enabled and (dropped > dropped_thr or invalid > invalid_thr) }}
        for:
          minutes: 1
    condition:
      - condition: template
        value_template: >-
          {{ is_state('timer.spectra_interactable_remediation_cooldown', 'active') or
             (states('counter.spectra_interactable_auto_remediations') | int(0)) >=
             (states('input_number.spectra_interactable_auto_remediation_max_per_hour') | int(3)) }}
      - condition: state
        entity_id: input_boolean.spectra_interactable_rollback_notifications_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: spectra_interactable_auto_remediate_suppressed
          title: "Spectra Interactables Remediation Suppressed"
          message: >-
            Quality spike detected but remediation is suppressed by cooldown/rate limit.
            cooldown={{ states('timer.spectra_interactable_remediation_cooldown') }}
            remediation_count={{ states('counter.spectra_interactable_auto_remediations') }}
            max_per_hour={{ states('input_number.spectra_interactable_auto_remediation_max_per_hour') }}.

  - id: spectra_interactable_cutover_ready_since_tracker
    alias: "Spectra: Interactable Cutover Ready Since Tracker"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
    action:
      - choose:
          - conditions: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              - service: input_number.set_value
                data:
                  entity_id: input_number.spectra_interactable_cutover_ready_since_ts_ms
                  value: "{{ (as_timestamp(now()) * 1000) | int }}"
        default:
          - service: input_number.set_value
            data:
              entity_id: input_number.spectra_interactable_cutover_ready_since_ts_ms
              value: 0

  - id: spectra_interactable_hourly_remediation_counter_reset
    alias: "Spectra: Interactable Hourly Remediation Counter Reset"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "0"
    action:
      - service: counter.reset
        target:
          entity_id: counter.spectra_interactable_auto_remediations

  - id: spectra_interactable_cutover_ready_notification_cleanup
    alias: "Spectra: Interactable Cutover Ready Notification Cleanup"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_cutover_ready
        to: "on"
        for:
          minutes: 1
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_rollback
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_pilot_activation_blocked
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_active_activation_blocked
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_auto_remediate
      - service: persistent_notification.dismiss
        data:
          notification_id: spectra_interactable_auto_remediate_suppressed

  - id: spectra_interactable_active_promotion_recommendation
    alias: "Spectra: Interactable Active Promotion Recommendation"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.spectra_interactable_active_preflight_ready
        to: "on"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_select.spectra_interactable_cutover_profile
        state: "pilot"
      - condition: state
        entity_id: input_boolean.spectra_interactable_rollback_notifications_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          notification_id: spectra_interactable_active_promotion_recommended
          title: "Spectra Interactables Active Promotion Ready"
          message: >-
            Pilot is meeting active preflight gates.
            You can run 'Activate Active (Safe)' now, or enable auto-promote.
            soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}
            success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
            dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
            invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%.

  - id: spectra_interactable_auto_promote_active
    alias: "Spectra: Interactable Auto Promote Active"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: input_boolean.spectra_interactable_auto_promote_active_enabled
        state: "on"
      - condition: state
        entity_id: input_select.spectra_interactable_cutover_profile
        state: "pilot"
      - condition: state
        entity_id: binary_sensor.spectra_interactable_active_preflight_ready
        state: "on"
      - condition: template
        value_template: >-
          {% set soak = states('input_number.spectra_interactable_cutover_soak_minutes') | float(10) %}
          {% set hold = states('input_number.spectra_interactable_auto_promote_hold_minutes') | float(5) %}
          {% set age_s = states('sensor.spectra_interactable_cutover_ready_soak_age_s') | float(0) %}
          {{ age_s >= ((soak + hold) * 60) }}
    action:
      - service: script.spectra_interactable_activate_active_safe
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_auto_promoted_active
                  title: "Spectra Interactables Auto-Promoted to Active"
                  message: >-
                    Auto-promote moved profile from pilot to active after sustained preflight hold.
                    soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.

  - id: spectra_interactable_profile_change_notification_cleanup
    alias: "Spectra: Interactable Profile Change Notification Cleanup"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.spectra_interactable_cutover_profile
    action:
      - choose:
          - conditions: "{{ trigger.to_state.state != 'pilot' }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_active_promotion_recommended
      - choose:
          - conditions: "{{ trigger.to_state.state != 'active' }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_auto_promoted_active
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_evidence_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m3_matrix_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m3_activation_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m3_activation_blocked
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m4_stabilization_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m4_closeout_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m4_retirement_packet
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_m4_finalization_packet

template:
  - sensor:
      - name: Spectra Interactable M3 Candidate Contract
        icon: mdi:shape-outline
        state: >-
          {% set iid = states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim %}
          {% set evt = states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim %}
          {% set trn = states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim %}
          {% set valid_evt = evt in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] %}
          {% set valid_trn = trn in ['ble','wifi_api','unknown',''] %}
          {% set valid_id = iid not in ['', 'unknown', 'unavailable'] and iid.startswith('spectra_') %}
          {{ iid if valid_id else 'invalid_id' }}|{{ evt if valid_evt else 'invalid_event' }}|{{ trn if valid_trn else 'invalid_transport' }}
        attributes:
          interactable_id: "{{ states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim }}"
          input_event: "{{ states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim }}"
          transport: "{{ states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim }}"
          candidate_valid: "{{ is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') }}"
          profile: "{{ states('input_select.spectra_interactable_cutover_profile') }}"

      - name: Spectra Interactable M3 Generalization Status
        icon: mdi:progress-wrench
        state: >-
          {% set candidate_valid = is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') %}
          {% set profile = states('input_select.spectra_interactable_cutover_profile') | lower %}
          {% if not candidate_valid %}
            candidate_invalid
          {% elif profile in ['shadow', 'pilot', 'active'] %}
            ready_for_multi_interactable_validation
          {% else %}
            ready_but_profile_disabled
          {% endif %}

      - name: Spectra Interactable M3 Matrix Blockers
        icon: mdi:alert-decagram-outline
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if not is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') %}
            {% set ns.items = ns.items + ['candidate_invalid'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_m3_matrix_source_keys_valid', 'on') %}
            {% set ns.items = ns.items + ['source_keys_invalid'] %}
          {% endif %}
          {% if states('input_select.spectra_interactable_cutover_profile') | lower == 'disabled' %}
            {% set ns.items = ns.items + ['profile_disabled'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M3 Matrix Verdict
        icon: mdi:check-network-outline
        state: >-
          {% set blockers = states('sensor.spectra_interactable_m3_matrix_blockers') %}
          {% if blockers == 'none' %}
            go_m3_validation_ready
          {% else %}
            no_go
          {% endif %}

      - name: Spectra Interactable M3 Matrix Last Summary
        icon: mdi:file-check-outline
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m3_matrix_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M3 Matrix Last Age S
        unit_of_measurement: "s"
        icon: mdi:timer-sand
        state: >-
          {% set ts = states('input_number.spectra_interactable_last_m3_matrix_ts_ms') | float(0) %}
          {% if ts <= 0 %}
            0
          {% else %}
            {{ ((as_timestamp(now()) * 1000 - ts) / 1000) | round(1) }}
          {% endif %}

      - name: Spectra Interactable M3 Activation Gate Blockers
        icon: mdi:alert-octagon-outline
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if not is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') %}
            {% set ns.items = ns.items + ['candidate_invalid'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_m3_matrix_source_keys_valid', 'on') %}
            {% set ns.items = ns.items + ['source_keys_invalid'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_m3_matrix_verdict') != 'go_m3_validation_ready' %}
            {% set ns.items = ns.items + ['matrix_not_ready'] %}
          {% endif %}
          {% set age = states('sensor.spectra_interactable_m3_matrix_last_age_s') | float(0) %}
          {% if age <= 0 or age > 900 %}
            {% set ns.items = ns.items + ['matrix_stale'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') %}
            {% set ns.items = ns.items + ['cutover_not_ready'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M3 Activation Gate Verdict
        icon: mdi:shield-check-outline
        state: >-
          {% if states('sensor.spectra_interactable_m3_activation_gate_blockers') == 'none' %}
            go_m3_activation_ready
          {% else %}
            no_go
          {% endif %}

      - name: Spectra Interactable M3 Activation Last Summary
        icon: mdi:clipboard-text-outline
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m3_activation_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M3 Unique Interactable Count
        icon: mdi:counter
        state: >-
          {% set raw = states('input_text.spectra_interactable_source_map_json') | trim %}
          {% set map_valid = raw not in ['', 'unknown', 'unavailable', 'none', 'None'] and raw.startswith('{') %}
          {% set source_map = (raw | from_json) if map_valid else dict() %}
          {% set ns = namespace(ids=[]) %}
          {% for k, v in source_map.items() %}
            {% if v is mapping and v.interactable_id is defined %}
              {% set iid = (v.interactable_id | string | lower | trim) %}
              {% if iid not in ['', 'unknown', 'unavailable'] and iid not in ns.ids %}
                {% set ns.ids = ns.ids + [iid] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set candidate = states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim %}
          {% if candidate not in ['', 'unknown', 'unavailable'] and candidate not in ns.ids %}
            {% set ns.ids = ns.ids + [candidate] %}
          {% endif %}
          {{ ns.ids | count }}

      - name: Spectra Interactable M3 Reuse Contract Status
        icon: mdi:source-branch-check
        state: >-
          {% set unique = states('sensor.spectra_interactable_m3_unique_interactable_count') | int(0) %}
          {% set matrix_ok = states('sensor.spectra_interactable_m3_matrix_verdict') == 'go_m3_validation_ready' %}
          {% set act_ok = states('sensor.spectra_interactable_m3_activation_gate_verdict') == 'go_m3_activation_ready' %}
          {% if unique >= 2 and matrix_ok and act_ok %}
            reusable_contract_proven
          {% elif unique < 2 %}
            requires_second_interactable
          {% else %}
            validation_pending
          {% endif %}

      - name: Spectra Interactable M3 Closeout Blockers
        icon: mdi:alert-circle-check-outline
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if states('sensor.spectra_interactable_m3_unique_interactable_count') | int(0) < 2 %}
            {% set ns.items = ns.items + ['unique_interactable_count_lt_2'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_m3_reuse_contract_status') != 'reusable_contract_proven' %}
            {% set ns.items = ns.items + ['reuse_contract_not_proven'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_m3_matrix_verdict') != 'go_m3_validation_ready' %}
            {% set ns.items = ns.items + ['matrix_not_ready'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_m3_activation_gate_verdict') != 'go_m3_activation_ready' %}
            {% set ns.items = ns.items + ['activation_gate_not_ready'] %}
          {% endif %}
          {% set max_age = states('input_number.spectra_interactable_m3_closeout_max_matrix_age_s') | float(900) %}
          {% if states('sensor.spectra_interactable_m3_matrix_last_age_s') | float(0) > max_age %}
            {% set ns.items = ns.items + ['matrix_stale'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M3 Closeout Verdict
        icon: mdi:certificate-outline
        state: >-
          {% if states('sensor.spectra_interactable_m3_closeout_blockers') == 'none' %}
            go_m3_closeout_ready
          {% else %}
            no_go
          {% endif %}

      - name: Spectra Interactable M3 Closeout Last Summary
        icon: mdi:clipboard-check-multiple-outline
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m3_closeout_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M4 Stabilization Last Summary
        icon: mdi:clipboard-pulse-outline
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m4_stabilization_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M4 Closeout Blockers
        icon: mdi:alert-circle-check
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if not is_state('binary_sensor.spectra_interactable_m3_closeout_ready', 'on') %}
            {% set ns.items = ns.items + ['m3_closeout_not_ready'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_bridge_active', 'on') %}
            {% set ns.items = ns.items + ['bridge_not_active'] %}
          {% endif %}
          {% if states('input_select.spectra_interactable_cutover_profile') | lower != 'active' %}
            {% set ns.items = ns.items + ['profile_not_active'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_cutover_ready', 'on') %}
            {% set ns.items = ns.items + ['cutover_not_ready'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_runtime_health_score') | float(0) < 90 %}
            {% set ns.items = ns.items + ['health_score_below_90'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_dispatch_success_pct') | float(0) < 96 %}
            {% set ns.items = ns.items + ['success_below_96'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_dropped_pct') | float(0) > 3 %}
            {% set ns.items = ns.items + ['dropped_above_3'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_invalid_pct') | float(0) > 1.5 %}
            {% set ns.items = ns.items + ['invalid_above_1_5'] %}
          {% endif %}
          {% set m3_age = states('sensor.spectra_interactable_m3_closeout_last_age_s') | float(0) %}
          {% if m3_age <= 0 or m3_age > 1800 %}
            {% set ns.items = ns.items + ['m3_closeout_evidence_stale'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M4 Closeout Verdict
        icon: mdi:certificate
        state: >-
          {% if states('sensor.spectra_interactable_m4_closeout_blockers') == 'none' %}
            go_m4_closeout_ready
          {% else %}
            no_go
          {% endif %}

      - name: Spectra Interactable M4 Closeout Last Summary
        icon: mdi:clipboard-check-multiple
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m4_closeout_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M4 Retirement Blockers
        icon: mdi:shield-alert-outline
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if not is_state('binary_sensor.spectra_interactable_m4_closeout_ready', 'on') %}
            {% set ns.items = ns.items + ['m4_closeout_not_ready'] %}
          {% endif %}
          {% if states('input_select.spectra_interactable_cutover_profile') | lower != 'active' %}
            {% set ns.items = ns.items + ['profile_not_active'] %}
          {% endif %}
          {% if not is_state('binary_sensor.spectra_interactable_cutover_ready_soaked', 'on') %}
            {% set ns.items = ns.items + ['cutover_soak_not_satisfied'] %}
          {% endif %}
          {% if is_state('timer.spectra_interactable_remediation_cooldown', 'active') %}
            {% set ns.items = ns.items + ['remediation_cooldown_active'] %}
          {% endif %}
          {% if states('counter.spectra_interactable_auto_remediations') | int(0) > 0 %}
            {% set ns.items = ns.items + ['remediation_count_nonzero'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_runtime_health_score') | float(0) < 94 %}
            {% set ns.items = ns.items + ['health_score_below_94'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_dispatch_success_pct') | float(0) < 98 %}
            {% set ns.items = ns.items + ['success_below_98'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_dropped_pct') | float(0) > 2 %}
            {% set ns.items = ns.items + ['dropped_above_2'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_invalid_pct') | float(0) > 1 %}
            {% set ns.items = ns.items + ['invalid_above_1'] %}
          {% endif %}
          {% set max_age = states('input_number.spectra_interactable_m4_retirement_max_closeout_age_s') | float(7200) %}
          {% set m4_age = states('sensor.spectra_interactable_m4_closeout_last_age_s') | float(0) %}
          {% if m4_age <= 0 or m4_age > max_age %}
            {% set ns.items = ns.items + ['m4_closeout_evidence_stale'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M4 Retirement Verdict
        icon: mdi:shield-check
        state: >-
          {% if states('sensor.spectra_interactable_m4_retirement_blockers') == 'none' %}
            go_m4_retirement_ready
          {% else %}
            no_go
          {% endif %}

      - name: Spectra Interactable M4 Retirement Last Summary
        icon: mdi:file-document-check
        state: >-
          {% set summary = states('input_text.spectra_interactable_last_m4_retirement_summary') | trim %}
          {{ summary if summary not in ['', 'unknown', 'unavailable'] else 'no_runs_yet' }}

      - name: Spectra Interactable M4 Retirement Ready Soak Age S
        unit_of_measurement: "s"
        icon: mdi:timer-check-outline
        state: >-
          {% set ts = states('input_number.spectra_interactable_m4_retirement_ready_since_ts_ms') | float(0) %}
          {% if ts <= 0 or not is_state('binary_sensor.spectra_interactable_m4_retirement_ready', 'on') %}
            0
          {% else %}
            {{ ((as_timestamp(now()) * 1000 - ts) / 1000) | round(1) }}
          {% endif %}

      - name: Spectra Interactable M4 Finalization Blockers
        icon: mdi:shield-star-outline
        state: >-
          {% set ns = namespace(items=[]) %}
          {% if not is_state('binary_sensor.spectra_interactable_m4_retirement_ready', 'on') %}
            {% set ns.items = ns.items + ['m4_retirement_not_ready'] %}
          {% endif %}
          {% set soak_needed_s = (states('input_number.spectra_interactable_m4_retirement_soak_minutes') | float(30)) * 60 %}
          {% set soak_age_s = states('sensor.spectra_interactable_m4_retirement_ready_soak_age_s') | float(0) %}
          {% if soak_age_s < soak_needed_s %}
            {% set ns.items = ns.items + ['retirement_soak_not_satisfied'] %}
          {% endif %}
          {% if is_state('timer.spectra_interactable_remediation_cooldown', 'active') %}
            {% set ns.items = ns.items + ['remediation_cooldown_active'] %}
          {% endif %}
          {% if states('sensor.spectra_interactable_runtime_health_score') | float(0) < 96 %}
            {% set ns.items = ns.items + ['health_score_below_96'] %}
          {% endif %}
          {% if ns.items | count == 0 %}
            none
          {% else %}
            {{ ns.items | join('|') }}
          {% endif %}

      - name: Spectra Interactable M4 Finalization Verdict
        icon: mdi:flag-checkered
