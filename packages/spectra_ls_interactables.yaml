script:
  spectra_interactable_activate_active_safe:
    alias: Spectra Interactable - Activate Active (Safe)
    mode: restart
    sequence:
      - variables:
          active_ready: "{{ is_state('binary_sensor.spectra_interactable_active_preflight_ready', 'on') }}"
      - choose:
          - conditions: "{{ not active_ready }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: "active_activation_blocked_preflight"
              - choose:
                  - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
                    sequence:
                      - service: persistent_notification.create
                        data:
                          notification_id: spectra_interactable_active_activation_blocked
                          title: "Spectra Interactables Active Activation Blocked"
                          message: >-
                            Active activation requires active preflight ready (cutover-ready + soak + quality thresholds).
                            Recommended profile: {{ states('sensor.spectra_interactable_recommended_profile') }}.
                            success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                            dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                            invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                            soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.
              - stop: "Active activation blocked because cutover readiness is off."
      - service: input_select.select_option
        data:
          entity_id: input_select.spectra_interactable_cutover_profile
          option: "active"
      - service: script.spectra_interactable_apply_cutover_profile
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_error
          value: ""
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_rollback
              - service: persistent_notification.dismiss
                data:
                  notification_id: spectra_interactable_active_activation_blocked

  spectra_interactable_capture_evidence_packet:
    alias: Spectra Interactable - Capture Evidence Packet
    mode: restart
    sequence:
      - variables:
          verdict: "{{ states('sensor.spectra_interactable_cutover_evidence_verdict') | trim }}"
          blockers: "{{ states('sensor.spectra_interactable_cutover_evidence_blockers') | trim }}"
          now_ts_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_evidence_capture_ts_ms
          value: "{{ now_ts_ms }}"
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_evidence_verdict
          value: "{{ verdict[:255] }}"
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_evidence_blockers
          value: "{{ blockers[:255] }}"
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_evidence_packet
                  title: "Spectra Interactables Evidence Packet Captured"
                  message: >-
                    verdict={{ verdict }}
                    blockers={{ blockers if blockers not in ['', 'none', 'None'] else 'none' }}
                    profile={{ states('input_select.spectra_interactable_cutover_profile') }}
                    recommended={{ states('sensor.spectra_interactable_recommended_profile') }}
                    success={{ states('sensor.spectra_interactable_dispatch_success_pct') }}%
                    dropped={{ states('sensor.spectra_interactable_dropped_pct') }}%
                    invalid={{ states('sensor.spectra_interactable_invalid_pct') }}%
                    soak_age_s={{ states('sensor.spectra_interactable_cutover_ready_soak_age_s') }}.

  spectra_interactable_run_m3_candidate_test:
    alias: Spectra Interactable - Run M3 Candidate Test
    mode: restart
    sequence:
      - variables:
          interactable_id: "{{ states('input_text.spectra_interactable_m3_candidate_interactable_id') | lower | trim }}"
          input_event: "{{ states('input_text.spectra_interactable_m3_candidate_input_event') | lower | trim }}"
          transport: "{{ states('input_text.spectra_interactable_m3_candidate_transport') | lower | trim }}"
          event_valid: "{{ input_event in ['encoder_turn','encoder_press','encoder_long_press','button_1','button_2','button_3','button_4'] }}"
          transport_valid: "{{ transport in ['ble','wifi_api','unknown',''] }}"
      - choose:
          - conditions: >-
              {{ interactable_id in ['', 'unknown', 'unavailable'] or (not event_valid) or (not transport_valid) }}
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: >-
                    m3_candidate_invalid id={{ interactable_id }} event={{ input_event }} transport={{ transport }}
              - stop: "M3 candidate test blocked by invalid candidate contract fields."
      - service: script.spectra_interactable_process_event
        data:
          interactable_id: "{{ interactable_id }}"
          input_event: "{{ input_event }}"
          transport: "{{ transport if transport not in ['', 'unknown', 'unavailable'] else 'unknown' }}"
          correlation_id: >-
            m3-candidate-{{ now().timestamp() | int }}

  spectra_interactable_run_m3_matrix_validation:
    alias: Spectra Interactable - Run M3 Matrix Validation
    mode: restart
    sequence:
      - variables:
          source_a: "{{ states('input_text.spectra_interactable_m3_matrix_source_key_a') | lower | trim }}"
          source_b: "{{ states('input_text.spectra_interactable_m3_matrix_source_key_b') | lower | trim }}"
          source_c: "{{ states('input_text.spectra_interactable_m3_matrix_source_key_c') | lower | trim }}"
          iterations: "{{ states('input_number.spectra_interactable_m3_matrix_iterations') | int(5) }}"
          source_keys_valid: "{{ is_state('binary_sensor.spectra_interactable_m3_matrix_source_keys_valid', 'on') }}"
          candidate_valid: "{{ is_state('binary_sensor.spectra_interactable_m3_candidate_valid', 'on') }}"
          before_total: "{{ states('counter.spectra_interactable_events_total') | int(0) }}"
          before_dispatched: "{{ states('counter.spectra_interactable_events_dispatched') | int(0) }}"
          before_invalid: "{{ states('counter.spectra_interactable_events_invalid') | int(0) }}"
          before_dropped: "{{ states('counter.spectra_interactable_events_dropped') | int(0) }}"
      - choose:
          - conditions: "{{ (not source_keys_valid) or (not candidate_valid) }}"
            sequence:
              - service: counter.increment
                target:
                  entity_id: counter.spectra_interactable_events_invalid
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: >-
                    m3_matrix_invalid_preflight source_keys_valid={{ source_keys_valid }} candidate_valid={{ candidate_valid }}
              - stop: "M3 matrix validation blocked by source-key or candidate contract invalid state."
      - repeat:
          count: "{{ iterations }}"
          sequence:
            - service: script.spectra_interactable_process_source_signal
              data:
                source_key: "{{ source_a }}"
                transport: "ble"
                correlation_id: >-
                  m3-matrix-a-{{ repeat.index }}-{{ now().timestamp() | int }}
            - service: script.spectra_interactable_process_source_signal
              data:
                source_key: "{{ source_b }}"
                transport: "ble"
                correlation_id: >-
                  m3-matrix-b-{{ repeat.index }}-{{ now().timestamp() | int }}
            - choose:
                - conditions: "{{ source_c not in ['', 'unknown', 'unavailable'] }}"
                  sequence:
                    - service: script.spectra_interactable_process_source_signal
                      data:
                        source_key: "{{ source_c }}"
                        transport: "ble"
                        correlation_id: >-
                          m3-matrix-c-{{ repeat.index }}-{{ now().timestamp() | int }}
            - service: script.spectra_interactable_run_m3_candidate_test
            - delay:
                milliseconds: 150
      - variables:
          after_total: "{{ states('counter.spectra_interactable_events_total') | int(0) }}"
          after_dispatched: "{{ states('counter.spectra_interactable_events_dispatched') | int(0) }}"
          after_invalid: "{{ states('counter.spectra_interactable_events_invalid') | int(0) }}"
          after_dropped: "{{ states('counter.spectra_interactable_events_dropped') | int(0) }}"
          delta_total: "{{ (after_total | int(0)) - (before_total | int(0)) }}"
          delta_dispatched: "{{ (after_dispatched | int(0)) - (before_dispatched | int(0)) }}"
          delta_invalid: "{{ (after_invalid | int(0)) - (before_invalid | int(0)) }}"
          delta_dropped: "{{ (after_dropped | int(0)) - (before_dropped | int(0)) }}"
          delta_success_pct: >-
            {% set total = ((after_total | int(0)) - (before_total | int(0))) %}
            {% set dispatched = ((after_dispatched | int(0)) - (before_dispatched | int(0))) %}
            {% if total > 0 %}
              {{ ((dispatched / total) * 100) | round(1) }}
            {% else %}
              0
            {% endif %}
          run_ts_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
          matrix_summary: >-
            total={{ delta_total }} ok={{ delta_dispatched }} invalid={{ delta_invalid }} dropped={{ delta_dropped }} success={{ delta_success_pct }}%
      - service: input_number.set_value
        data:
          entity_id: input_number.spectra_interactable_last_m3_matrix_ts_ms
          value: "{{ run_ts_ms }}"
      - service: input_text.set_value
        data:
          entity_id: input_text.spectra_interactable_last_m3_matrix_summary
          value: "{{ matrix_summary[:255] }}"
      - choose:
          - conditions: "{{ is_state('input_boolean.spectra_interactable_rollback_notifications_enabled', 'on') }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: spectra_interactable_m3_matrix_packet
                  title: "Spectra Interactables M3 Matrix Validation"
                  message: >-
                    {{ matrix_summary }}
                    verdict={{ states('sensor.spectra_interactable_m3_matrix_verdict') }}
                    blockers={{ states('sensor.spectra_interactable_m3_matrix_blockers') }}

  spectra_interactable_activate_m3_generalization_safe:
    alias: Spectra Interactable - Activate M3 Generalization (Safe)
    mode: restart
    sequence:
      - variables:
          gate_ready: "{{ is_state('binary_sensor.spectra_interactable_m3_activation_gate_ready', 'on') }}"
          blockers: "{{ states('sensor.spectra_interactable_m3_activation_gate_blockers') | trim }}"
          matrix_age_s: "{{ states('sensor.spectra_interactable_m3_matrix_last_age_s') | float(0) }}"
          profile_before: "{{ states('input_select.spectra_interactable_cutover_profile') | lower | trim }}"
      - choose:
          - conditions: "{{ not gate_ready }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.spectra_interactable_last_error
                  value: >-
                    m3_activation_blocked_preflight blockers={{ blockers }} matrix_age_s={{ matrix_age_s }}
              - choose:
